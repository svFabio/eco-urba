services:
  # ---------------------------------------------------------------------------
  # 1. Backend REST API (FastAPI + Python 3.12 + uv)
  # ---------------------------------------------------------------------------
  - type: web
    name: eco-urba-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PROJECT_NAME
        value: EcoUrba API
      - key: NASA_EARTHDATA_USERNAME
        sync: false
      - key: NASA_EARTHDATA_PASSWORD
        sync: false
      - key: GAMC_API_KEY
        sync: false
      - key: GAMC_SERVICE_ID
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Frontend Geospatial Dashboard (Angular 19+ SPA)
  # ---------------------------------------------------------------------------
  - type: web
    name: eco-urba
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build && echo "window.__API_BASE__='https://${BACKEND_HOST}/api/v1';" > dist/frontend/browser/env.js
    staticPublishPath: dist/frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: eco-urba-api
          property: host
